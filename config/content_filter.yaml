# 新闻内容过滤配置
#
# 用途：排除用户关注范围之外的新闻。当前重点是经济栏目里混入的
# 社会琐事（彩票开奖、美食消费、营销活动、职场生活等）。
#
# mode:
#   drop_before_save       命中关键词的新闻不入库（默认，源头过滤）
#   exclude_from_delivery  新闻照常入库，但不出现在摘要/Word/飞书交付中
#
# categories:
#   _default       应用于所有分类的关键词
#   economy        仅应用于经济分类
#   politics       仅应用于政治分类
#   international  仅应用于国际分类
#
# 匹配方式：对标题（含 RSS 摘要）做不区分大小写的子串匹配，
# 命中任一关键词即过滤。关键词可按需增删。
enabled: true
mode: drop_before_save
categories:
  _default:
    - 娛樂
    - 藝人
    - 明星
    - 八卦
    - 網紅
    - 美食
    - 旅遊
    - 景點
    - 天氣
    - 氣象
    - 車禍
    - 火災
    - 竊案
    - 命案
    - 酒駕
  economy:
    # 彩票/开奖
    - 大樂透
    - 今彩
    - 威力彩
    - 雙贏彩
    - 統一發票
    - 頭獎
    - 開獎
    - 中獎
    - 槓龜
    # 营销/抽奖/活动
    - 抽獎
    - 滿額送
    - 好康
    - 優惠券
    - 開幕
    - 試營運
    - 打卡
    - 開戶交易
    - 活動開跑
    # 职场/生活消费
    - 面試
    - 職場
    - 高蛋白麵
    - 糕餅
    - 月餅
    - 年菜
    - 粽子
    - 小吃
    - 夜市
    - 咖啡
    - 餐廳
    - 星巴克
    - 手搖飲
    - 甜點
    - 烘焙
    - 宅配
  politics: []
  international: []
