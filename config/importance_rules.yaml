enabled: true
thresholds:
  critical: 85
  important: 65
  normal: 0
display:
  max_highlights: 5
total_cap: 5
lanes:
  # 重点简报的台湾/本地保留位；选举位计入此总数，不与其叠加。
  taiwan_domestic:
    min_slots: 3
  election:
    min_slots: 1
scoring:
  official_source_bonus: 5
  tier1_international_bonus: 3   # Tier-1 国际媒体加分（<= official_source_bonus，validate_rules_config 校验）
  multi_rule_bonus: 5
  category_bonus:
    politics: 3
    economy: 0
    international: 0
  official_sources:
  - 總統府
  - 行政院
  - 國防部
  - 外交部
  - 陸委會
  - 中央社
  # Tier-1 国际媒体（与 config/international_media.yaml tier1_international_media 同步）
  tier1_international_media:
  - Reuters
  - Financial Times
  - Wall Street Journal
  - Bloomberg
feishu_highlight_card:
  enabled: true
  title: "本期重点新闻提示"
  show_summary: false
  show_source: false
  show_published_at: false
  use_importance_max_highlights: true
