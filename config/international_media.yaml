# 跨媒体事件去重（显示层，不写库）：仅对国际媒体文章聚类。聚类方式为
# “时间窗内相似度图”的传递闭包（连通分量）：两篇之间构成合并边当且仅当
# 同时满足 ① 在 window_hours 时间窗内；② 标题归一化 token 集 Jaccard >=
# similarity_threshold；③ 归一化后共享 >= 2 个 core_words 核心概念。
# canonical 取 published_at 最早，并列按 source_priority（Reuters >
# Financial Times > Wall Street Journal > Bloomberg）。
# 保守优先：无 published_at / 超时间窗 / aware-naive 混合 / 相似度不足 /
# 共享核心词不足 2 个的都不构成边。
dedup:
  similarity_threshold: 0.70   # 标题相似度阈值（0~1；0.70 结合同义词归一
                               # 可使“China launches drills near Taiwan /
                               # China begins military exercises around Taiwan /
                               # China starts new Taiwan military drills”
                               # 三篇聚类为同一事件，同时负例不误合并）
  window_hours: 24             # 相似去重时间窗口（小时）
  source_priority:
    - Reuters
    - Financial Times
    - Wall Street Journal
    - Bloomberg
  # 核心地理/事件词：同义词归一后，两篇标题共享 >= 2 个才构成合并边条件之一
  core_words:
    - Taiwan
    - Strait
    - China
    - Beijing
    - Washington
    - US
    - TSMC
    - chip
    - chips
    - military
    - missile
    - missiles
    - exercise
    - exercises
    - drill
    - drills
    - tariff
    - tariffs
    - sanction
    - sanctions
    - export
    - exports
    - arms
    - Pentagon
    - PLA
  # 轻量同义词归一（应用于小写 token，先于停用词过滤与词干化）
  synonyms:
    drill: exercise
    drills: exercise
    exercise: exercise
    exercises: exercise
    maneuvers: exercise
    wargames: exercise
    launches: start
    begins: start
    starts: start
    commences: start
    holds: start
    near: near
    around: near
    off: near
    surrounding: near

# 来源加分（与 config/importance_rules.yaml scoring 同步）：
# importance.py 按 source_name 命中 scoring.tier1_international_media 时 +3。
# 硬约束：tier1_international_bonus(3) <= official_source_bonus(5)，
# 由 importance.validate_rules_config 校验。
source_bonus:
  tier1: 3
