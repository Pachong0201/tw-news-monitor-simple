# 现有新闻管道不读取本文件；main/Word 接线在后续任务。
#
# 调研结论与启用/停用依据见 docs/international_sources_research.md
# ══════════════════════════════════════════════════════════════════

enabled: true

# 展示名映射：英文 canonical 名 -> 中文展示名。
# Article.source_name 复用为 canonical publisher（如 "Reuters"），
# 下游展示中文名时查此表（display_name），查不到则回退英文名。
display_names:
  Reuters: 路透社
  Financial Times: 金融时报
  Wall Street Journal: 华尔街日报
  Bloomberg: 彭博社

# Tier-1 国际媒体（四家英文 canonical 名，与 sources.yaml 中国际源条目一致）。
tier1_international_media:
  - Reuters
  - Financial Times
  - Wall Street Journal
  - Bloomberg

