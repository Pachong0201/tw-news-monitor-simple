# 飞书交付配置模板（不含真实 Webhook / App Secret）
# 真实值只通过环境变量读取，禁止写入本文件。

delivery:
  default_provider: feishu
  enabled: true                  # 显式启用；缺凭据不会自动视为关闭
  mode: app_file_upload          # webhook_summary | app_file_upload | delivery_disabled
  fallback_mode: none            # 本轮禁止自动降级

  webhook:
    env: FEISHU_WEBHOOK

  app:
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    chat_id_env: FEISHU_CHAT_ID

  feishu:
    timeout_seconds: 30
    max_attempts: 2
    send_summary: true
    send_artifact: true

  # 能力说明：
  # - webhook_summary：只需要 FEISHU_WEBHOOK，只能发送文本摘要，file_delivery_supported=false。
  # - app_file_upload：需要 FEISHU_APP_ID/FEISHU_APP_SECRET/FEISHU_CHAT_ID，可上传 Word，不要求 Webhook。
  # - delivery_disabled：必须显式 delivery.enabled=false，缺凭据不等于关闭交付。

security:
  feishu_credentials_rotated_after_incident: false
  feishu_rotation_acknowledged_at: null
