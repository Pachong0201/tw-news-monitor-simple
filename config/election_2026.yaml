  # 合并组（新竹縣市/嘉義縣市）在此以合并名为唯一键；
  # 底层数据始终保存标准县市名（新竹縣/新竹市/嘉義縣/嘉義市），不做合并。
  display_order:
    - 全局動向
    - 台北市
    - 新北市
    - 桃園市
    - 台中市
    - 台南市
    - 高雄市
    - 基隆市
    - 新竹縣市
    - 苗栗縣
    - 彰化縣
    - 南投縣
    - 雲林縣
    - 嘉義縣市
    - 屏東縣
    - 宜蘭縣
    - 花蓮縣
    - 台東縣
    - 澎湖縣
    - 金門縣
    - 連江縣

  # 展示合并组：底层 regions 分别存标准名，Word 同组合并显示。
  merge_groups:
    新竹縣市:
      - 新竹縣
      - 新竹市
    嘉義縣市:
      - 嘉義縣
      - 嘉義市

