# =============================================================
# 2026 九合一选举专题识别与展示配置
#
# 用途：
#   1) 判断新闻是否属于 2026 九合一选举（县市长/议员等地方公职选举）
#   2) 归类：national（全局动向）/ local（单一县市）/ multi_region（多县市）
#   3) Word 简报"九合一选举"一级栏目的县市排序与合并展示
#
# 约定：
#   - 新闻标题为繁体中文为主，词表繁简并列维护。
#   - "选举/候选人/民调"本身不是无条件正词，仅在组合评分中出现。
#   - 本配置缺失或损坏时，加载器返回 {"enabled": False}，主链路不受影响。
# =============================================================

enabled: true

# ---------- 评分阈值 ----------
thresholds:
  direct: 60        # score >= 60 → 明确命中九合一
  review: 40        # 40 <= score < 60 → 疑似区（无 LLM，按保守子规则裁决）
                    # score < 40 → 非九合一

# ---------- 信号分值 ----------
scoring:
  strong_term: 45     # 强信号词（九合一/县市长选举/参选等）
  auxiliary_term: 25  # 辅助信号词（选战/民调/造势等）
  entity: 20          # 候选人实体命中（仅辅助证据，不单独判正）
  region_in_title: 15 # 县市标准名出现在标题
  action_context: 15  # 选举行为语境（竞选团队/政见/辅选等，常出现在摘要/正文）

# 设计意图：
#   strong(45) + auxiliary(25) = 70 >= 60 → 直接判正
#   strong(45) + entity(20)   = 65 >= 60 → 直接判正（如"陈亭妃宣布参选"）
#   entity(20) + region(15)   = 35 < 40  → 不判正（如"陈亭妃质询行政院"）
#   entity(20) + auxiliary(25) + region(15) = 60 → 判正（疑似区满足保守子规则）

# ---------- 强信号词（高权重） ----------
strong_terms:
  - 九合一
  - 九合一選舉
  - 縣市長選舉
  - 縣長選舉
  - 縣市長提名
  - 縣市長徵召
  - 縣市長人選
  - 縣長人選
  - 縣長提名
  - 市長選舉
  - 直轄市長選舉
  - 市長人選
  - 地方選舉
  - 縣市議員選舉
  - 參選
  - 宣布參選
  - 投入選戰
  - 登記參選
  - 表態參選

# ---------- 辅助信号词（需与强词/实体/地区组合） ----------
# 注意：过泛词（市長/整合）不作为独立辅助信号——"市长主持市政会议"
# "整合行銷"等日常语境会误伤；选举语境由强词/具体行为词承载。
auxiliary_terms:
  - 選戰
  - 選情
  - 初選
  - 黨內初選
  - 民調
  - 支持度
  - 徵召
  - 提名
  - 提名辦法
  - 中執會
  - 中常會
  - 造勢
  - 拜票
  - 掃街
  - 競選
  - 競選總部
  - 競選團隊
  - 輔選
  - 連任
  - 挑戰
  - 接班
  - 選舉佈局
  - 佈局
  - 縣市長
  - 縣長
  - 攻防
  - 政見
  - 候選人
  - 選民

# ---------- 负向词（一票否决：命中即非九合一） ----------
# 注意：2024/2028/回顧 等词命中整句即否决，避免历史/未来选举混入。
negative_terms:
  - 總統選舉
  - 總統大選
  - 2028總統
  - 2024總統
  - 立委選舉
  - 立法委員選舉
  - 黨主席選舉
  - 中常委選舉
  - 黨職選舉
  - 理事長選舉
  - 理事選舉
  - 學生會選舉
  - 校園選舉
  - 美國州長
  - 美國選舉
  - 日本選舉
  - 日本眾議院
  - 南韓選舉
  - 法國選舉
  - 外國選舉
  - 回顧2024
  - 回顧
  - 歷史回顧

# ---------- 政务抑制词（现任首长例行政务/灾防，非选举行为） ----------
# 命中即抑制"市長+实体+地区"式误判（如"新北市长侯友宜视察台风应变"）。
routine_governance_terms:
  - 視察
  - 勘災
  - 主持
  - 出席
  - 頒獎
  - 揭牌
  - 應變
  - 防颱
  - 防疫
  - 施政
  - 市政會議
  - 確診
  - 新書

# ---------- 全局动向场景（命中 → scope=national） ----------
# 适用于：政党整体提名制度 / 中央党部选战部署 / 全国蓝白合作 /
#          全国选情 / 全党动员 / 多县市总体布局。
national_scenes:
  - 縣市長提名機制
  - 縣市長提名辦法
  - 提名機制
  - 提名特別辦法
  - 縣市長徵召
