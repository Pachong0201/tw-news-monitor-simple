# 台南选情半月研判部署配置模板（不含任何真实密钥）
# 真实凭据只通过环境变量提供，禁止写入本文件。

deployment:
  run_mode: production            # development | dry_run | production
  schedule:
    run_days: [9, 22]             # 每月9日、22日生成
    run_time: "09:00"             # Asia/Taipei 默认生成时间
    timezone: Asia/Taipei
  provider:
    default: deepseek             # 生产默认 Provider
    model_env: DEEPSEEK_MODEL     # 默认 deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
  delivery:
    default_provider: feishu
    enabled: true
    mode: app_file_upload
    fallback_mode: none
    webhook_env: FEISHU_WEBHOOK
    app_id_env: FEISHU_APP_ID
    app_secret_env: FEISHU_APP_SECRET
    chat_id_env: FEISHU_CHAT_ID
    send_summary: true
    send_artifact: false          # Webhook-only 环境必须保持 false
  paths:
    evidence_packages: data/reports/tainan_2026/evidence_packages
    generated_reports: data/reports/tainan_2026/generated_reports
    pipeline_runs: data/reports/tainan_2026/pipeline_runs
    deployment_validation: data/reports/tainan_2026/deployment_validation
  retry:
    delivery_max_attempts: 2
  log_level: INFO

security:
  feishu_credentials_rotated_after_incident: false
  feishu_rotation_acknowledged_at: null
